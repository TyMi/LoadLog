[project]
name = "loadlog"
version = "0.0.9"
description = "Laborierungs-Journal und Auswertung für LabRadar-Daten"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "weasyprint>=62",
  "py_ballisticcalc>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loadlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
