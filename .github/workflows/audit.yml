name: Audit

# Prüft die gesperrten Abhängigkeiten auf bekannte Sicherheitslücken. Nur meldend: kein Pflicht-Check, ein Fund färbt den Lauf nicht rot,
# erscheint aber als Warnung in der Zusammenfassung. Kostenlos (öffentliches Repository, Standard-Runner).

on:
  schedule:
    - cron: "17 5 * * 1"  # montags
  workflow_dispatch:
  pull_request:
    paths:
      - backend/uv.lock
      - frontend/package-lock.json
      - .github/workflows/audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Python-Abhängigkeiten (pip-audit)
        continue-on-error: true
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.9.0 pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
      - name: Frontend-Abhängigkeiten (npm audit)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev
