name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.15"]  # unterste unterstützte und aktuelle Version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Systembibliotheken für PDF-Tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - run: uv sync --locked --python ${{ matrix.python }}
        working-directory: backend
      - run: uv run ruff check src tests
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: docker build -t loadlog:ci .
      - run: docker run -d --name loadlog -p 8080:8080 -e LOADLOG_HOST=0.0.0.0 loadlog:ci
      - name: Smoketest (synthetische Demodaten)
        run: |
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done
          uv run --project backend python scripts/smoke_test.py http://127.0.0.1:8080
      - if: failure()
        run: docker logs loadlog
